name: CI/CD Podman Fixed
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'apps/client/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
            server:
              - 'apps/server/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'compose.dev.yaml'
              - 'compose.prod.yaml'
              - 'Containerfile'
              - 'deploy/**'
              - 'scripts/**'

  client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-client-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-client-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx @biomejs/biome check ./apps/client ./packages/shared
      - run: bunx expo-doctor
      - run: npx expo-modules-autolinking verify -v
      - run: bun --filter @meapp/client export:web
        env:
          EXPO_PUBLIC_API_URL: https://api.meapp.example
      - name: Deploy web bundle
        if: github.ref == 'refs/heads/main'
        run: |
          rsync -avz apps/client/dist/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ vars.WEB_DIST_PATH || '/var/www/meapp-web/dist/' }}"
      - name: EAS Update
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g eas-cli
          eas update --branch production --message ${{ github.sha }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-server-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-server-${{ runner.os }}-
      - name: Install Podman deps
        run: sudo apt update && sudo apt install -y podman passt netavark aardvark-dns
      - run: bun install --frozen-lockfile

      # Phase 7: Destructive Migration Guard
      - name: Check destructive migrations (Phase 7)
        run: |
          chmod +x scripts/check-destructive-migration.sh
          ALLOW_DESTRUCTIVE=${{ contains(github.event.pull_request.labels.*.name, 'allow-destructive-migration') }} ./scripts/check-destructive-migration.sh

      - name: Typecheck all workspaces
        run: bun run typecheck
      - run: bunx @biomejs/biome check ./apps/server/src ./packages
      - run: bun --filter @meapp/server test
      # bun audit fails hard on workspace root in some versions; gate on
      # moderate+ and let it report without failing PRs on advisories we
      # cannot fix yet. Remove --audit-level once the tree is clean.
      - run: bun audit --audit-level moderate || true

      - name: Build immutable tag
        if: github.ref == 'refs/heads/main'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          SHA_TAG=sha-${{ github.sha }}
          podman build -t ghcr.io/meapp-labs/meapp:$SHA_TAG -t ghcr.io/meapp-labs/meapp:server -f Containerfile .
          podman push ghcr.io/meapp-labs/meapp:$SHA_TAG
          podman push ghcr.io/meapp-labs/meapp:server
          echo "SHA_TAG=$SHA_TAG" >> $GITHUB_ENV

      - name: Trivy scan
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/meapp-labs/meapp:${{ env.SHA_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  migrate:
    needs: [detect-changes, server]
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: meapp-migration-prod
      cancel-in-progress: false
    steps:
      - name: Safe DB Backup (VACUUM INTO) & Migrate
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            SHA_TAG=sha-${{ github.sha }}
            # Pre-migration backup via VACUUM INTO — the image has no sqlite3
            # binary, so use bun's sqlite (same technique as chaos-test.sh).
            podman exec meapp-server bun -e "import {getDbInstance} from './packages/db/src/client.ts'; getDbInstance().sqlite.exec(\"VACUUM INTO '/data/backup-pre-${SHA_TAG}.db'\")" || true
            podman exec meapp-server bun -e "import {Database} from 'bun:sqlite'; const db = new Database('/data/backup-pre-${SHA_TAG}.db'); console.log('integrity:', db.query('PRAGMA integrity_check;').get())" || true
            # Execute migrations via the freshly pulled image. Override the
            # default CMD (which would migrate AND serve) with the migrate entry.
            podman pull ghcr.io/meapp-labs/meapp:$SHA_TAG
            podman run --rm -v meapp-server-data:/data:Z --env DATABASE_URL=/data/data.db --env NODE_ENV=production ghcr.io/meapp-labs/meapp:$SHA_TAG bun apps/server/dist/migrate.js

  deploy:
    needs: [migrate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy with rollback
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            SHA_TAG=sha-${{ github.sha }}
            PREV_TAG=$(cat ~/meapp-current-tag 2>/dev/null || echo "server")
            echo $SHA_TAG > ~/meapp-current-tag

            podman pull ghcr.io/meapp-labs/meapp:$SHA_TAG

            # Update the quadlet drop-in (committed in deploy/) with the new tag.
            # The base quadlet lives in ~/.config/containers/systemd/ and was
            # installed once from the repo — sed only rewrites the Image= line
            # via a versioned drop-in, keeping the unit file itself stable.
            mkdir -p ~/.config/containers/systemd/meapp.container.d
            cat > ~/.config/containers/systemd/meapp.container.d/tag.conf <<EOF
            [Container]
            Image=ghcr.io/meapp-labs/meapp:$SHA_TAG
            EOF
            systemctl --user daemon-reload
            systemctl --user restart meapp.service

            # Health check with rollback
            ok=0
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done

            if [ "$ok" != "1" ]; then
              echo "Health failed, rolling back to $PREV_TAG"
              cat > ~/.config/containers/systemd/meapp.container.d/tag.conf <<EOF
            [Container]
            Image=ghcr.io/meapp-labs/meapp:$PREV_TAG
            EOF
              systemctl --user daemon-reload
              systemctl --user restart meapp.service
              exit 1
            fi
            echo "Deployed $SHA_TAG, health ok. Previous tag $PREV_TAG (backup-pre-$SHA_TAG.db kept in /data for manual restore)."
