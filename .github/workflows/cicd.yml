name: CI/CD Podman Fixed
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'apps/client/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
            server:
              - 'apps/server/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'compose.dev.yaml'
              - 'scripts/**'

  client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx @biomejs/biome check ./apps/client ./packages/shared
      - run: bunx expo-doctor
      - run: npx expo-modules-autolinking verify -v
      - run: bun --filter client export:web
      - if: github.ref == 'refs/heads/main'
        run: rsync -avz apps/client/dist/ user@server:/var/www/meapp-web/dist/
      - if: github.ref == 'refs/heads/main'
        run: |
          npm install -g eas-cli
          eas update --branch production --message ${{ github.sha }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install Podman deps
        run: sudo apt update && sudo apt install -y podman passt netavark aardvark-dns trivy
      - run: bun install --frozen-lockfile

      # Phase 7: Destructive Migration Guard
      - name: Check destructive migrations (Phase 7)
        run: |
          chmod +x scripts/check-destructive-migration.sh
          ALLOW_DESTRUCTIVE=${{ contains(github.event.pull_request.labels.*.name, 'allow-destructive-migration') }} ./scripts/check-destructive-migration.sh

      - run: bunx @biomejs/biome check ./apps/server/src ./packages
      - run: bun --filter @meapp/server test
      - run: bun audit

      - name: Build immutable tag
        if: github.ref == 'refs/heads/main'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          SHA_TAG=sha-${{ github.sha }}
          podman build -t ghcr.io/meapp-labs/meapp:$SHA_TAG -t ghcr.io/meapp-labs/meapp:server -f apps/server/Dockerfile .
          podman push ghcr.io/meapp-labs/meapp:$SHA_TAG
          podman push ghcr.io/meapp-labs/meapp:server
          echo "SHA_TAG=$SHA_TAG" >> $GITHUB_ENV

      - name: Trivy scan
        if: github.ref == 'refs/heads/main'
        run: podman run --rm aquasec/trivy image ghcr.io/meapp-labs/meapp:${{ env.SHA_TAG }}

  migrate:
    needs: [detect-changes, server]
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: meapp-migration-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Safe DB Backup (VACUUM INTO) & Migrate
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            SHA_TAG=sha-${{ github.sha }}
            # Safe backup via VACUUM INTO (WAL safe, no torn reads)
            podman exec meapp-server sqlite3 /app/data/data.db "VACUUM INTO '/app/data/backup-pre-${SHA_TAG}.db'" || true
            podman exec meapp-server sqlite3 /app/data/backup-pre-${SHA_TAG}.db "PRAGMA integrity_check;" || true
            # Execute migrations via server container
            podman exec meapp-server bun run src/migrate.ts

  deploy:
    needs: [migrate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            SHA_TAG=sha-${{ github.sha }}
            PREV_TAG=$(cat ~/meapp-current-tag || echo "server")
            echo $SHA_TAG > ~/meapp-current-tag
            podman pull ghcr.io/meapp-labs/meapp:$SHA_TAG
            # Update Quadlet to new tag
            sed -i "s|Image=ghcr.io/meapp-labs/meapp:.*|Image=ghcr.io/meapp-labs/meapp:$SHA_TAG|" ~/.config/containers/systemd/meapp.container
            systemctl --user daemon-reload
            systemctl --user restart meapp.container
            # Health check
            for i in {1..10}; do
              if curl -f http://127.0.0.1:3000/health; then
                echo "Health ok"
                exit 0
              fi
              sleep 3
            done
            echo "Health failed, rolling back to $PREV_TAG"
            sed -i "s|Image=ghcr.io/meapp-labs/meapp:.*|Image=ghcr.io/meapp-labs/meapp:$PREV_TAG|" ~/.config/containers/systemd/meapp.container
            systemctl --user daemon-reload
            systemctl --user restart meapp.container
            exit 1
